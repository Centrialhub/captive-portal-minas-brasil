<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WiFi Grátis | Drogaria Minas Brasil</title>
    <meta name="description" content="Acesse o Wi-Fi grátis das Drogarias Minas Brasil em segundos. Conexão rápida, segura e gratuita para você aproveitar enquanto faz suas compras.">
    <meta property="og:title" content="WiFi Grátis | Drogaria Minas Brasil">
    <meta property="og:description" content="Conecte-se ao Wi-Fi gratuito da Drogaria Minas Brasil de forma rápida e segura.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/png" href="/favicon-mb.png">
    <!-- Replaced with the inline, CSP-hashed startup protection during build. -->
    <!-- PORTAL_BOOT -->
    <style>
      body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #E30613; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
      .loading-shell { padding: 2rem; }
      .loading-logo { height: 60px; margin-bottom: 1rem; }
      [hidden] { display: none !important; }
      #portal-recovery { max-width: 28rem; margin: auto; padding: 2rem; color: white; }
      #portal-retry { border: 0; border-radius: 0.5rem; padding: 0.9rem 1.2rem; background: white; color: #b3000d; font: inherit; font-weight: 700; cursor: pointer; }
      #portal-retry:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-shell">
        <img src="/favicon-mb.png" alt="Logo" class="loading-logo">
        <p>Carregando portal...</p>
      </div>
    </div>
    <section id="portal-recovery" hidden role="alert" aria-labelledby="portal-recovery-title">
      <h1 id="portal-recovery-title">Não foi possível carregar o acesso ao Wi-Fi</h1>
      <p id="portal-recovery-message">Confira se continua conectado à rede Wi-Fi e tente carregar a página novamente.</p>
      <button id="portal-retry" type="button">Tentar carregar novamente</button>
    </section>
    <noscript>
      <div style="padding: 20px; text-align: center;">
        <h2>JavaScript Necessário</h2>
        <p>Para acessar o Wi-Fi gratuito, você precisa ativar o JavaScript no seu navegador.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
